# DeepSeek-V2-Lite HC Routing with Student-T Estimator
# ======================================================

model:
  name: "deepseek"
  model_id: "deepseek-ai/DeepSeek-V2-Lite"
  num_experts: 64
  default_top_k: 6
  dtype: "bfloat16"
  device_map: "auto"

estimator:
  type: "student_t"
  quantile_range: [0.05, 0.95]
  bins: 71
  model_dir: null  # Train on-the-fly

hc_routing:
  beta: 0.5
  temperature: 1.0
  min_k: 2
  max_k: 8
  patch_mode: null

evaluation:
  datasets:
    - "wikitext"
  max_samples: 200
  max_length: 512
  batch_size: 1
  log_every_n: 100

output:
  results_dir: "./results/deepseek_student_t"
  save_plots: true
  save_logs: true
  plot_format: "png"
  plot_dpi: 100

device: "cuda"
