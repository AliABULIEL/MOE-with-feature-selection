# DeepSeek-V2-Lite HC Routing with KDE Estimator
# ================================================

model:
  name: "deepseek"
  model_id: "deepseek-ai/DeepSeek-V2-Lite"
  num_experts: 64
  default_top_k: 6
  dtype: "bfloat16"
  device_map: "auto"

estimator:
  type: "kde"
  quantile_range: [0.05, 0.95]
  max_samples: 50000
  model_dir: null  # Set to "kde_models" if pre-trained models available

hc_routing:
  beta: 0.5
  temperature: 1.0
  min_k: 2
  max_k: 8
  patch_mode: null  # null = all layers, or integer for last N layers

evaluation:
  datasets:
    - "wikitext"
    - "lambada"
  max_samples: 200
  max_length: 512
  batch_size: 1
  log_every_n: 100

output:
  results_dir: "./results/deepseek_kde"
  save_plots: true
  save_logs: true
  plot_format: "png"
  plot_dpi: 100

device: "cuda"
